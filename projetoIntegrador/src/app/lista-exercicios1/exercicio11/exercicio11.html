<h2>{{ nomeProduto }}</h2>

<p>Preço: R$ {{ preco.toFixed(2) }}</p>
<p>Quantidade:</p>
<button (click)="diminuirQuantidade()" [disabled]="quantidade === 1"> - </button>

<p>{{ quantidade }}</p>

<button (click)="aumentarQuantidade()"> + </button>

<p>Total: R$ {{ (preco * quantidade).toFixed(2) }}</p>

<button (click)="adicionarCarrinho()"> Adicionar ao carrinho </button>

<p>{{ mensagem }}</p>
